include:
  - path: ./datalens/docker-compose.yaml

services:

  postgres:
    image: postgres:16
    container_name: company-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: company
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password

    ports:
      - "5433:5432"

    volumes:
      - ./postgres:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: company-n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - TZ=Asia/Almaty

    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./incoming:/files/incoming
      - ./processed:/files/processed
      - ./error:/files/error
      - ./transcriptions:/files/transcriptions

    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company-web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=company
      - DB_USER=company_user
      - DB_PASSWORD=company_password
      - TZ=Asia/Almaty
      # На Windows Docker не получает события изменения файлов — без опроса --reload не видит правки кода
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./app:/app/app
      - ./export_db_to_json.py:/app/export_db_to_json.py
      - ./call_categories.py:/app/call_categories.py
      - ./tire_sizes.py:/app/tire_sizes.py
      - ./branch_registry.py:/app/branch_registry.py
      - ./frontend:/app/frontend
      - ./prompts:/app/prompts
      - ./incoming:/app/incoming
      - ./processed:/app/processed
      - ./processing:/app/processing
      - ./.tech:/app/.tech
      - ./.env:/app/.env:ro
    depends_on:
      - postgres